[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundus-eye-disease-classification"
version = "0.1.0"
description = "Reproducible research pipeline for colour fundus image classification."
requires-python = ">=3.10"
dependencies = [
  "albumentations>=1.4",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "timm>=1.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
