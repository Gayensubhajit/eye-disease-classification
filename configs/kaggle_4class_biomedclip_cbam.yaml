seed: 42

data:
  train_dir: "data_kaggle_4class/train"
  val_dir: "data_kaggle_4class/val"
  test_dir: "data_kaggle_4class/test"
  image_size: 224
  num_classes: 4
  class_names:
    - "cataract"
    - "diabetic_retinopathy"
    - "glaucoma"
    - "normal"
  crop_fundus: false
  apply_clahe: true

model:
  name: biomedclip_cbam_fusion
  pretrained: true
  dropout: 0.3

loss:
  name: "focal"
  gamma: 2.0

training:
  batch_size: 8
  epochs: 18
  learning_rate: 0.00005
  weight_decay: 0.0001
  num_workers: 4
  device: auto
  use_weighted_sampler: true
  scheduler: cosine

output:
  directory: outputs/kaggle_4class_biomedclip_cbam
