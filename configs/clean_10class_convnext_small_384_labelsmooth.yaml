seed: 42
data:
  train_dir: data_clean/train
  val_dir: data_clean/val
  test_dir: data_clean/test
  image_size: 384
  num_classes: 10
  class_names:
  - Central Serous Chorioretinopathy [Color Fundus]
  - Diabetic Retinopathy
  - Disc Edema
  - Glaucoma
  - Healthy
  - Macular Scar
  - Myopia
  - Pterygium
  - Retinal Detachment
  - Retinitis Pigmentosa
  crop_fundus: true
  apply_clahe: true
  conservative_augmentation: false
model:
  name: convnext_small
  pretrained: true
  dropout: 0.3
loss:
  name: cross_entropy
  label_smoothing: 0.1
training:
  batch_size: 4
  epochs: 20
  learning_rate: 5.0e-05
  weight_decay: 0.0001
  num_workers: 2
  device: cuda
  use_weighted_sampler: false
  scheduler: cosine
  use_amp: false
  evaluate_test: false
output:
  directory: outputs/clean_10class_convnext_small_384_labelsmooth
