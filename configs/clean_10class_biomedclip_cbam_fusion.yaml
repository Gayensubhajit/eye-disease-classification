# Stage 4 Scientific Research Protocol: 10-Class BiomedCLIP + CBAM Fusion Ablation
# Controlled architectural ablation against the EfficientNet-B0 reference baseline on data_clean/

seed: 42

data:
  train_dir: "data_clean/train"
  val_dir: "data_clean/val"
  test_dir: "data_clean/test"
  image_size: 224
  num_classes: 10
  class_names:
    - "Central Serous Chorioretinopathy [Color Fundus]"
    - "Diabetic Retinopathy"
    - "Disc Edema"
    - "Glaucoma"
    - "Healthy"
    - "Macular Scar"
    - "Myopia"
    - "Pterygium"
    - "Retinal Detachment"
    - "Retinitis Pigmentosa"
  crop_fundus: true
  apply_clahe: false
  augmentation_mode: "conservative"

model:
  name: "biomedclip_cbam_fusion"
  pretrained: true
  dropout: 0.3

loss:
  name: "cross_entropy"

training:
  batch_size: 16
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 2
  device: "cuda"
  use_weighted_sampler: false
  scheduler: "cosine"
  use_amp: false         # Pure FP32 determinism
  evaluate_test: false   # Strict test set quarantine

output:
  directory: "outputs/clean_10class_biomedclip_cbam_fusion"
