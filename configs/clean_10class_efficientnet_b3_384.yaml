# Cleaned 10-Class Benchmark Configuration: EfficientNet-B3 (384x384 CLAHE)
# Evaluated on audited, leakage-controlled data_clean/ with test quarantine

seed: 42

data:
  train_dir: "data_clean/train"
  val_dir: "data_clean/val"
  test_dir: "data_clean/test"
  image_size: 384
  num_classes: 10
  class_names:
    - "Central Serous Chorioretinopathy [Color Fundus]"
    - "Diabetic Retinopathy"
    - "Disc Edema"
    - "Glaucoma"
    - "Healthy"
    - "Macular Scar"
    - "Myopia"
    - "Pterygium"
    - "Retinal Detachment"
    - "Retinitis Pigmentosa"
  crop_fundus: true
  apply_clahe: true

model:
  name: "efficientnet_b3"
  pretrained: true
  dropout: 0.3

loss:
  name: "cross_entropy"

training:
  batch_size: 4
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 2
  device: "cuda"
  use_weighted_sampler: false
  scheduler: "cosine"
  use_amp: false
  evaluate_test: false

output:
  directory: "outputs/clean_10class_efficientnet_b3_384"
