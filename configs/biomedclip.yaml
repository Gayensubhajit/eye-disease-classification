seed: 42

data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  image_size: 224
  num_classes: 10
  class_names:
    - "Central Serous Chorioretinopathy [Color Fundus]"
    - "Diabetic Retinopathy"
    - "Disc Edema"
    - "Glaucoma"
    - "Healthy"
    - "Macular Scar"
    - "Myopia"
    - "Pterygium"
    - "Retinal Detachment"
    - "Retinitis Pigmentosa"
  crop_fundus: true
  apply_clahe: false

model:
  name: biomedclip # Microsoft BiomedCLIP (ViT-Base medical foundation model)
  pretrained: true
  dropout: 0.2

loss:
  name: "focal" # Options: cross_entropy, weighted_ce, focal
  gamma: 2.0

training:
  batch_size: 16
  epochs: 20
  learning_rate: 0.0001 # Slightly lower LR for fine-tuning foundation model
  weight_decay: 0.0001
  num_workers: 4
  device: auto
  use_weighted_sampler: true
  scheduler: cosine

output:
  directory: outputs/biomedclip
