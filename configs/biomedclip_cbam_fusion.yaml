seed: 42

data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  image_size: 224
  num_classes: 10
  class_names:
    - "Central Serous Chorioretinopathy [Color Fundus]"
    - "Diabetic Retinopathy"
    - "Disc Edema"
    - "Glaucoma"
    - "Healthy"
    - "Macular Scar"
    - "Myopia"
    - "Pterygium"
    - "Retinal Detachment"
    - "Retinitis Pigmentosa"
  crop_fundus: true
  apply_clahe: true

model:
  name: biomedclip_cbam_fusion # Microsoft BiomedCLIP + CBAM Dual Attention + Multi-Scale Feature Pyramid Fusion
  pretrained: true
  dropout: 0.3

loss:
  name: "focal" # Focal Loss focusing on hard Glaucoma & Myopia samples
  gamma: 2.0

training:
  batch_size: 16
  epochs: 25 # Training on 2,800 balanced images
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  device: auto
  use_weighted_sampler: true
  scheduler: cosine

output:
  directory: outputs/biomedclip_cbam_fusion
