seed: 42

data:
  dataset_dir: "Eye Disease Image Dataset/Original Dataset/Original Dataset"
  train_csv: "data/splits/train.csv"
  val_csv: "data/splits/val.csv"
  test_csv: "data/splits/test.csv"
  image_size: 224
  num_classes: 10
  class_names:
    - "Central Serous Chorioretinopathy [Color Fundus]"
    - "Diabetic Retinopathy"
    - "Disc Edema"
    - "Glaucoma"
    - "Healthy"
    - "Macular Scar"
    - "Myopia"
    - "Pterygium"
    - "Retinal Detachment"
    - "Retinitis Pigmentosa"
  crop_fundus: true
  apply_clahe: false

model:
  name: efficientnet_b0
  pretrained: true
  dropout: 0.2

loss:
  name: "focal" # Options: cross_entropy, weighted_ce, focal
  gamma: 2.0

training:
  batch_size: 16
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  device: auto
  use_weighted_sampler: true # Samples all 10 classes equally during training
  scheduler: cosine # Options: cosine, reduce_on_plateau, step

output:
  directory: outputs

