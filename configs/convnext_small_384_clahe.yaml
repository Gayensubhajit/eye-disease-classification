seed: 42

data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  image_size: 384
  num_classes: 10
  class_names:
    - "Central Serous Chorioretinopathy [Color Fundus]"
    - "Diabetic Retinopathy"
    - "Disc Edema"
    - "Glaucoma"
    - "Healthy"
    - "Macular Scar"
    - "Myopia"
    - "Pterygium"
    - "Retinal Detachment"
    - "Retinitis Pigmentosa"
  crop_fundus: true
  apply_clahe: true

model:
  name: convnext_small # Modern 7x7 Depthwise ConvNet with LayerNorm & Inverted Bottlenecks
  pretrained: true
  dropout: 0.3

loss:
  name: "focal" # Focal Loss focusing on hard diagnostic categories
  gamma: 2.0

training:
  batch_size: 4 # Optimized for 4GB VRAM (uses only ~1.43 GB)
  epochs: 20
  learning_rate: 0.00005
  weight_decay: 0.0001
  num_workers: 4
  device: auto
  use_weighted_sampler: true
  scheduler: cosine

output:
  directory: outputs/convnext_small_384_clahe
