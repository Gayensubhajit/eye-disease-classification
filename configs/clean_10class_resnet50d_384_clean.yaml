# Cleaned 10-Class Benchmark Configuration: ResNet-50d (384x384 CLAHE) Clean Run
# 20 Uninterrupted Epochs with Seed 42, Cosine Scheduler, and Test Quarantine

seed: 42

data:
  train_dir: "data_clean/train"
  val_dir: "data_clean/val"
  test_dir: "data_clean/test"
  image_size: 384
  num_classes: 10
  class_names:
    - "Central Serous Chorioretinopathy [Color Fundus]"
    - "Diabetic Retinopathy"
    - "Disc Edema"
    - "Glaucoma"
    - "Healthy"
    - "Macular Scar"
    - "Myopia"
    - "Pterygium"
    - "Retinal Detachment"
    - "Retinitis Pigmentosa"
  crop_fundus: true
  apply_clahe: true

model:
  name: "resnet50d"
  pretrained: true
  dropout: 0.25

loss:
  name: "cross_entropy"

training:
  batch_size: 4
  epochs: 20
  learning_rate: 0.00005
  weight_decay: 0.00005
  num_workers: 2
  device: "cuda"
  use_weighted_sampler: false
  scheduler: "cosine"
  use_amp: false
  evaluate_test: false

output:
  directory: "outputs/clean_10class_resnet50d_384_clean"
